name: CI

on:
  push:
    branches: [main, development, qa]
  pull_request:
    branches: [main, development, qa]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - run: pnpm verify

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image with safe defaults
        run: docker build -f deploy/Dockerfile -t perkos-pay:ci .
      - name: Test standalone health without external network
        run: |
          docker run -d --network none --name perkos-pay-ci perkos-pay:ci
          for attempt in $(seq 1 30); do
            if docker exec perkos-pay-ci node -e 'fetch("http://127.0.0.1:3000/api/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              exit 0
            fi
            sleep 2
          done
          docker logs perkos-pay-ci
          exit 1
      - name: Remove the CI container
        if: always()
        run: docker rm -f perkos-pay-ci || true
